name: Windows-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Hazirlik
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip
          .\ngrok\ngrok.exe authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      - name: RDP ve Kullanici
        continue-on-error: true
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          net user runneradmin Sifre123456! /add
          net localgroup administrators runneradmin /add

      - name: Baglan
        run: |
          Start-Process -FilePath ".\ngrok\ngrok.exe" -ArgumentList "tcp 3389"
          Write-Host "Adres araniyor..."
          $n = 0
          while ($n -lt 20) {
            try {
              $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
              $url = $response.tunnels[0].public_url
              if ($url) {
                Write-Host "`n`n===================================="
                Write-Host "ADRES: $url"
                Write-Host "KULLANICI: runneradmin"
                Write-Host "SIFRE: Sifre123456!"
                Write-Host "===================================="
                Start-Sleep -Seconds 21600
                break
              }
            } catch {
              Write-Host "Henuz hazir degil, bekleniyor... ($n)"
              Start-Sleep -Seconds 10
              $n++
            }
          }
          
